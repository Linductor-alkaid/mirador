name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
            preset: debug
          - compiler: clang
            cxx: clang++
            preset: debug
          - compiler: gcc
            cxx: g++
            preset: warnings
          - compiler: gcc
            cxx: g++
            preset: asan
          - compiler: gcc
            cxx: g++
            preset: ubsan
          - compiler: gcc
            cxx: g++
            preset: tsan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.cxx }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: |
          # TSan on newer kernels hits "unexpected memory mapping" with high-entropy
          # ASLR; disable ASLR for the test process only.
          if [ "${{ matrix.preset }}" = "tsan" ]; then
            setarch "$(uname -m)" -R ctest --preset tsan
          else
            ctest --preset ${{ matrix.preset }}
          fi

  # Ubuntu 20.04 (focal) adaptation gate: the oldest supported Ubuntu LTS.
  # The hosted ubuntu-20.04 runner image is retired, so the stock focal
  # container provides the real 20.04 userland (default GCC 9.4, CMake 3.16.3,
  # Ninja 1.10.0). The public API uses std::span, which needs libstdc++ >= 10,
  # so the job builds with the distro-provided g++-10; the stock GCC 9 is
  # documented as unsupported (docs/compatibility/compatibility.md). CMake
  # 3.16 cannot read CMakePresets.json (needs >= 3.21) and ctest --test-dir
  # needs >= 3.20, so this job drives plain -S/-B and runs ctest in-tree.
  ubuntu20-04:
    name: gcc10 / ubuntu-20.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      # focal left standard support in 2025-05; if its pocket has been moved
      # off archive.ubuntu.com, repoint sources.list before anything else.
      - name: Refresh apt sources and install git
        run: |
          set -e
          if ! apt-get update; then
            sed -i 's|archive.ubuntu.com|old-releases.ubuntu.com|g; s|security.ubuntu.com|old-releases.ubuntu.com|g' /etc/apt/sources.list
            apt-get update
          fi
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++-10 cmake ninja-build
      - name: Configure
        run: >
          cmake -S . -B build/ubuntu20.04 -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-10
      - name: Build
        run: cmake --build build/ubuntu20.04
      - name: Test
        run: |
          cd build/ubuntu20.04
          ctest --output-on-failure

  windows:
    name: msvc / ninja
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Locate the installed MSVC environment instead of hardcoding a VS generator
      # version, which breaks when runner images ship a different VS release.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMIRADOR_BUILD_TESTS=ON -DMIRADOR_BUILD_ADAPTERS_CAPTURE_WINDOWS=ON
      - name: Build
        run: cmake --build build/windows
      - name: Test
        run: ctest --test-dir build/windows --output-on-failure

  android:
    name: ndk / arm64-v8a
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 26.3.11579264
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Android NDK
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -S . -B build/android -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DCMAKE_BUILD_TYPE=Debug
          -DMIRADOR_BUILD_TESTS=ON
          -DMIRADOR_BUILD_ADAPTERS_CAPTURE_ANDROID=ON
      - name: Build
        run: cmake --build build/android

  # M1-09: the optional OpenCV adapter builds and tests against the
  # integrator-provided OpenCV of the runner image (apt, never vendored).
  opencv:
    name: gcc / opencv-adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libopencv-dev
      - name: Configure
        run: cmake -S . -B build/opencv -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMIRADOR_BUILD_ADAPTERS_OPENCV=ON
      - name: Build
        run: cmake --build build/opencv
      - name: Test
        run: ctest --test-dir build/opencv --output-on-failure

  # M5-02 (DEC-015): the opt-in reference integrations fetch the pinned ncnn
  # at configure time, build the runtime wrapper and run the synthetic-model
  # smoke test. The default build matrix never touches this option.
  integrations:
    name: gcc / integrations-ncnn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy
      - name: Configure (fetches pinned ncnn; requires network)
        # Explicit compile database export: the integrations tidy step needs
        # it, and not every runner CMake exports it by default for Ninja.
        run: cmake -S . -B build/integrations -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DMIRADOR_BUILD_INTEGRATIONS=ON
      - name: Build
        run: cmake --build build/integrations
      - name: Test
        run: ctest --test-dir build/integrations --output-on-failure
      - name: Run clang-tidy over integrations sources
        run: |
          clang-tidy --version
          git ls-files 'integrations/*.cpp' | xargs clang-tidy --warnings-as-errors='*' -p build/integrations

  # M5-05: the optional capture adapters. The Linux X11 adapter builds and
  # runs its synthetic-window smoke test against a virtual display (no real
  # screen); the Android adapter's pure conversion parts build and run their
  # host test here (the NDK-only sources compile in the android job).
  capture-adapters:
    name: gcc / capture-adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev xvfb clang-tidy
      - name: Configure
        run: >
          cmake -S . -B build/capture -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DMIRADOR_BUILD_ADAPTERS_CAPTURE_LINUX=ON -DMIRADOR_BUILD_ADAPTERS_CAPTURE_ANDROID=ON
      - name: Build
        run: cmake --build build/capture
      - name: Test
        run: xvfb-run -a ctest --test-dir build/capture --output-on-failure
      - name: Run clang-tidy over host-compilable adapter sources
        run: |
          clang-tidy --version
          # NDK-only Android sources (projection_capture, accessibility_jni)
          # are compiled by the android job against the NDK toolchain; they
          # have no host compile database to lint against.
          git ls-files 'adapters/capture-linux/*.cpp' 'adapters/capture-android/*.cpp' \
            ':!adapters/capture-android/projection_capture.cpp' \
            ':!adapters/capture-android/accessibility_jni.cpp' \
            | xargs clang-tidy --warnings-as-errors='*' -p build/capture

  # M5-07: bounded libFuzzer runs over the three pure high-risk surfaces.
  # The harnesses carry their own address+undefined sanitizer flags; findings
  # fail the job. Optional (default-off) and clang-only by construction.
  fuzz:
    name: clang / fuzz
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMIRADOR_BUILD_FUZZ=ON
      - name: Build
        run: cmake --build build/fuzz
      - name: Run harnesses (bounded)
        run: |
          ./build/fuzz/tests/fuzz/mirador_fuzz_db_postprocess -max_total_time=30 -rss_limit_mb=2048
          ./build/fuzz/tests/fuzz/mirador_fuzz_cache_key -max_total_time=30 -rss_limit_mb=2048
          ./build/fuzz/tests/fuzz/mirador_fuzz_transform -max_total_time=30 -rss_limit_mb=2048

  lint:
    name: clang-format / clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy libopencv-dev
      - name: Configure (generate compile_commands.json)
        # Adapter ON so the compile database covers adapters/ for clang-tidy.
        # integrations/ stays OFF here; its sources are linted in the
        # integrations job against their own compile database.
        run: cmake --preset debug -DMIRADOR_BUILD_ADAPTERS_OPENCV=ON
      - name: Check formatting
        run: |
          clang-format --version
          git ls-files '*.cpp' '*.cc' '*.h' '*.hpp' | xargs clang-format --dry-run --Werror
      - name: Run clang-tidy
        run: |
          clang-tidy --version
          # integrations/ and the platform capture adapters are linted in
          # their own jobs against their own compile databases.
          git ls-files '*.cpp' '*.cc' ':!integrations/**' ':!adapters/capture-linux/**' ':!adapters/capture-windows/**' ':!adapters/capture-android/**' | xargs clang-tidy --warnings-as-errors='*' -p build/debug
